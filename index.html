<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>

    Yangirasm.src = "https://www.bing.com/th/id/OIP.XQ6CyncXgEdljRssh_LAIwHaEK?w=193&h=135&c=8&rs=1&qlt=90&o=6&dpr=1.5&pid=3.1&rm=2";

    document.body.appendChild(Yangirasm);

    ochiriladiganParagraf.remove(1);

        alert("Tugma bosildi!");

</script>
